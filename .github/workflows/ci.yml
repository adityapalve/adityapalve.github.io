name: Check the site and village

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run worker:check
      - run: npm run build
      # Deployment belongs to Cloudflare: pushing to master builds and deploys the Worker.
      # This job only proves the code, including the room, before that happens.
      - name: Test the local village room
        run: |
          npx wrangler dev --port 8787 > "$RUNNER_TEMP/village-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8787/ > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run worker:test
